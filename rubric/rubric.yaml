version: customer-service-v2.0
status: independent_draft_for_calibration
language: zh-CN
basis: 海马爸比工作台MVP会议纪要 20260825.md §§2.1、2.2、3.1、5
purpose: 评价当前对话节点下一轮客户回复及客服内部辅助；不是完整问题解决率，也不把参考要点齐全等同真实客服体验。
scopes:
  customer_reply: 建议回复（可直接发给客户）中的整段内容；列表、括号和附注都计入负担。
  internal: 依据与下一步；允许必要的完整来源和条件分支，不按客户消息长度惩罚。
  evidence: 题目可见会话、原始现行知识库、逐题参考要点。归档不得覆盖现行口径；引用格式可以映射核验。
  isolation: 所有评分文件仅供评分侧，禁止加入答题 Agent 的提示词、知识库或 Skill。
ratings: {excellent: 1.0, adequate: 0.5, poor: 0.0}
criteria:
- id: business_points
  points: 30
  scope: 客户回复与内部处理计划；各业务点按本轮必要性分配表达位置。
  description: 使用逐题 business_points 原描述和原相对权重。必须当轮告知的结论、紧急风险不能仅藏在内部；需要先确认条件的后续步骤，可在内部明确待确认后执行，不要求提前发给客户。此定位优先于旧描述中泛化的“完整”。不得遗漏，只允许有条件地延后。
  levels:
    excellent: 该要点事实、条件、风险与动作均正确；出现在适合的区域和轮次。
    adequate: 方向正确但缺少一个必要限定或可执行动作，未造成决定性错误。
    poor: 要点缺失、含义相反、未确认条件却断言，或该当轮告知的重要风险只留在内部。
- id: turn_decision
  points: 20
  scope: 客户回复为主，结合下一步检查是否真正等待反馈。
  description: 基于已经知道的信息选择直接回答、最小必要追问、一个排查阶段或立即安全/人工处置。问清改变处理分支的关键未知；不能用近似问题代替确认，不重复已经明确的事实。无需追问的简单参数题直接答，不为追求多轮而拖延。
  levels:
    excellent: 正确使用上下文，优先获取决定下一步的最小必要信息或直接回答；后续操作有明确触发条件。
    adequate: 总体顺序正确，但有一个冗余追问或次要条件不够明确，不改变正确分支。
    poor: 未确认关键条件就推进某方案；重复已有信息而忽略真正未知；明明可答却无必要地多轮；应紧急处置却先常规排查。
- id: customer_load
  points: 20
  scope: 只评价客户可发送部分，不把内部资料长度相加。
  description: 本轮消息让客户清楚下一步要回答什么或先做什么。评估独立问题数、操作阶段数、未触发分支、术语和无必要附带信息。内容相关不等于此刻必要。一个阶段可含不可分割的连贯小步骤；若客户明确要完整指南或紧急风险需要更多说明，允许必要长度并说明例外。
  levels:
    excellent: 单一清楚焦点；通常一个关键追问或一个排查阶段，少量紧密关联的信息可以合并；保留立即必要的安全提醒，留出反馈节点。
    adequate: 主行动清楚，但有可删的重复、附带提醒或次要分支；无需客户自行筛选大量步骤。
    poor: 同时让客户回答多项不同目的问题、尝试多个可分离排查方案并阅读后续分支；在型号/场景未定时发操作清单；像说明书，客户必须自己选路径，即使信息均相关。
- id: natural_contextual_reply
  points: 15
  scope: 客户可发送部分。
  description: 用自然、具体、易理解的客服语言回应本次会话。情绪回应应贴合用户实际表现，不能只因出现“您好/别着急”判优秀；中性参数询问无需强加安抚，不模仿真人身份或承诺未执行的后台操作。与负担区分：长短看 customer_load，表达是否模板化看本项。
  levels:
    excellent: 语句自然具体，不官腔、不责备；适当承接已表达的焦虑或等待成本；术语解释够用，无内部推理或评分话术。
    adequate: 可理解可发送，但套话、生硬或无必要的安抚；未明显激化情绪。
    poor: 公式化大段通知、居高临下或推卸责任、无视明确情绪；内部说明当客户话术，或靠空泛安抚替代回应。
- id: grounding
  points: 10
  scope: 依据对照客户回复及内部计划中的事实。
  description: 来源能核验到具体文件/章节及支持的口径；Utopia 文档 ID、Wiki 页面等可通过映射核验，不因格式不同扣分。缺资料应说明未知；不因无知识库条件豁免引用要求，但单列该实验限制。
  levels:
    excellent: 关键事实和必要限定有现行来源对应，无法支持处明确标未知且不作承诺。
    adequate: 关键事实可核验，少量次要引用不完整或章节定位不精确。
    poor: 关键结论无可核验依据、引用并不支持、把归档当现行或以推测补事实。
- id: internal_support
  points: 5
  scope: 依据、下一步，以及三部分的分离。
  description: 客服知道本轮先发送什么、等待什么信息、何时执行后续步骤或转给谁，必要交接项明确。内部方案可比客户消息详细，但不以完整穷举为优秀。三部分职责清晰；等价标题可接受，Markdown层级本身不决定成败。
  levels:
    excellent: 明确当前动作与待反馈后分支，必要时有交接对象/信息和来源入口，三部分清楚分离。
    adequate: 可执行但分支、交接信息或来源入口有次要缺漏，或一个内部部分缺失而未影响核心动作。
    poor: 客服需自行猜测当前动作，内部方案互相冲突、未指出何时等待或升级，或大段内部内容混入客户回复。
controls:
- id: no_answer
  cap: 0
  trigger: 无实质客户回复或只有报错/未解析工具标记；基础设施失败无输出也适用，并另列运行失败，不能解释成业务能力差。
- id: wrong_task
  cap: 20
  trigger: 回复对象或问题实质错位，无法用于当前会话；标题格式或轻微寒暄不触发。
- id: decisive_business_error
  cap: 20
  trigger: 明确给出与可核验现行知识/决定性参考事实矛盾的核心结论，或编造影响客户行动的关键参数、故障原因、交易承诺；忽略关键未知并给出确定处理分支。须标明原话、来源、影响，不以轻微漏项触发。
- id: urgent_safety_failure
  cap: 20
  trigger: 题目有明确即时人身/设备/数据不可逆风险，回复却延误必要风险处置、要求危险操作，或越权承诺敏感业务。普通断网不自动当紧急安全事故。
- id: severe_turn_failure
  cap: 59
  trigger: turn_decision=poor。
- id: severe_customer_overload
  cap: 59
  trigger: customer_load=poor。不能只按字数或列表数量触发，必须指出不必要的多阶段/分支和本轮更小行动。
aggregation:
  scale: 0-100
  business: 30 * sum(original_kp_weight * level_value) / sum(original_kp_weight)
  other: sum(criterion_points * level_value), excluding business_points
  total: min(clamp(business + other, 0, 100), all_triggered_caps)
  rounding: 保留完整精度计算，最终四舍五入到两位小数。
  penalties: 不另作加法扣分；旧 penalty 映射为维度判断或封顶控制。多个封顶取最小，不重复相减。
  missing_or_conflicting_evidence: 标记 needs_review，不输出正式总分；不得把冲突强行判错或猜测参考正确。
  group_reporting: 全部预定题含空输出的总体均分与成功作答子集均分分别报告；needs_review缺判不得当0填充，注明评分覆盖数；同时列维度分、封顶率、完成率、时延、token、API及工具错误。
review_requirements:
- 先写清当前已知、关键未知、本轮目标、立即必要风险和可延后内容；不能先给分再补理由。
- 每项给独立等级和依据；引用必须是候选回答连续原文片段，附字符区间；缺失项可以空引用但须明确缺失内容。省略号/改写不当原文证据。
- 对 poor、任何封顶和满分优先复核。满足格式、引用多、提到安抚不构成优秀证据。
- 同一问题只扣到直接对应维度；例如仅冗长不自动再扣自然度。相同事实错误可以触发业务等级与安全封顶，但总分按最小封顶而非叠加罚分。
- 不用回答模型隐藏思维评分。工具轨迹只核验来源与运行状态；最终回复质量与运行成本分开。
- 对初版新 benchmark 保留参考答案未经业务确认标签。参考与知识库冲突或多种业务解释均成立时 needs_review，禁止把历史客服原话默认当标准答案。
